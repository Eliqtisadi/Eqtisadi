<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>كود QR — الاقتصادي</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .qr-layout{display:grid;gap:24px;grid-template-columns:minmax(300px,400px) 1fr;align-items:start}
  @media (max-width:880px){.qr-layout{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .field label{font-size:13.5px;font-weight:700;color:var(--text-2)}
  .field input[type=text],.field input[type=url],.field select{
    padding:11px 14px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--surface);color:var(--text);font:inherit;font-size:14.5px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .field-row{display:flex;gap:12px}
  .field-row .field{flex:1}
  .check{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;margin-bottom:14px;cursor:pointer}
  .check input{width:18px;height:18px;accent-color:var(--brand)}
  .warn{padding:14px 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent-700);font-size:14px;margin-bottom:16px}

  /* ---- الملصق القابل للطباعة ---- */
  .poster{
    position:relative;background:#fff;color:var(--ink);border-radius:var(--radius);border:1px solid var(--line);
    padding:40px 30px 34px;text-align:center;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:16px;overflow:hidden;
  }
  .poster::before{content:"";position:absolute;inset-inline:0;top:0;height:6px;background:linear-gradient(90deg,var(--brand),var(--accent))}
  .poster-logo{width:auto;height:66px;margin-top:6px}
  .poster-branch{font-size:18px;font-weight:800;color:var(--ink-700)}
  .qr-box{padding:16px;background:#fff;border-radius:18px;border:1px solid #ececec;box-shadow:0 10px 26px -16px rgba(20,33,58,.35)}
  .qr-box canvas{display:block;width:min(72vw,300px);height:auto;image-rendering:pixelated}
  .poster-cta{font-size:21px;font-weight:900;color:var(--ink);line-height:1.35}
  .poster-sub{font-size:14px;color:var(--text-2);max-width:40ch;line-height:1.6}
  .poster-url{font-size:12.5px;color:#98a0af;direction:ltr;word-break:break-all}

  @media print{
    @page{margin:14mm}
    body{background:#fff}
    .site-header,.no-print,.section-head{display:none !important}
    .section{padding:0}
    .qr-layout{display:block}
    .poster{border:0;box-shadow:none;padding:0}
    .poster::before{display:none}
    .qr-box canvas{width:80mm}
  }
</style>
</head>
<body>

<header class="site-header no-print">
  <div class="wrap header-inner">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/img/logo.svg" alt=""></a>
    <a class="btn btn-ghost btn-sm" href="index.html" style="margin-inline-start:auto">رجوع للموقع</a>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="section-head no-print">
      <div>
        <h2>كود QR للمتجر</h2>
        <p class="muted">اطبعه وضعه عند الكاشير أو على الأكياس والواجهة — العميل يمسحه فيفتح صفحة العروض.</p>
      </div>
    </div>

    <div class="qr-layout">
      <!-- عناصر التحكم -->
      <div class="card no-print">
        <div class="warn" id="cdnWarn" hidden>
          تعذّر تحميل مكتبة توليد الكود (تحتاج اتصالًا بالإنترنت أول مرة). حدّث الصفحة بعد الاتصال.
        </div>

        <div class="field">
          <label for="qUrl">رابط الصفحة</label>
          <input type="url" id="qUrl" dir="ltr" placeholder="https://offers.aleqtisade.com">
        </div>
        <div class="field">
          <label for="qCta">الجملة الرئيسية</label>
          <input type="text" id="qCta" value="امسح الكود لمشاهدة العروض">
        </div>
        <div class="field">
          <label for="qSub">جملة توضيحية</label>
          <input type="text" id="qSub" value="عروض الأسبوع، مواعيد العمل، وحساباتنا على مواقع التواصل">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="qColor">لون الكود</label>
            <select id="qColor">
              <option value="#14213A" selected>كحلي (لون الموقع)</option>
              <option value="#1D4ED8">أزرق الهوية</option>
              <option value="#000000">أسود</option>
            </select>
          </div>
          <div class="field">
            <label for="qSize">حجم التحميل (بكسل)</label>
            <select id="qSize">
              <option value="512">512</option>
              <option value="1024" selected>1024</option>
              <option value="2048">2048</option>
            </select>
          </div>
        </div>

        <label class="check"><input type="checkbox" id="qLogo" checked> إظهار الشعار الكامل داخل الكود</label>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          <button class="btn btn-primary btn-sm" id="btnPng" type="button">تحميل PNG</button>
          <button class="btn btn-ghost btn-sm" id="btnSvg" type="button">تحميل SVG</button>
          <button class="btn btn-ghost btn-sm" id="btnPrint" type="button">طباعة الملصق</button>
        </div>
      </div>

      <!-- معاينة الملصق -->
      <div class="poster" id="poster">
        <img class="poster-logo" id="pLogo" src="assets/img/logo.svg" alt="">
        <div class="poster-branch" id="pBranch"></div>
        <div class="qr-box"><canvas id="qrCanvas" width="300" height="300"></canvas></div>
        <div class="poster-cta" id="pCta">امسح الكود لمشاهدة العروض</div>
        <div class="poster-sub" id="pSub"></div>
        <div class="poster-url" id="pUrl"></div>
      </div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var modules = null;
  var logoImg = new Image();
  var logoReady = false, logoDataUri = "";
  var logoRatio = 459 / 147; // نسبة عرض/ارتفاع اللوجو الكامل (تُحدَّث بعد التحميل)

  function defaultUrl() {
    return "https://offers.aleqtisade.com";
  }
  function color() { return $("#qColor").value || "#14213A"; }
  function logoOn() { return $("#qLogo").checked; }

  /* ---------- بناء وحدات الكود ---------- */
  function build() {
    if (typeof qrcode !== "function") { $("#cdnWarn").hidden = false; return; }
    var text = $("#qUrl").value.trim() || defaultUrl();
    // لو الشعار في المنتصف نستخدم أعلى تصحيح خطأ (H) ليظل قابلًا للمسح
    var qr = qrcode(0, "H");
    qr.addData(text); qr.make();
    var n = qr.getModuleCount();
    modules = [];
    for (var r = 0; r < n; r++) { modules[r] = []; for (var c = 0; c < n; c++) modules[r][c] = qr.isDark(r, c); }
    draw($("#qrCanvas"), 8, 4);
    $("#pUrl").textContent = text;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- رسم الكود (والشعار في المنتصف داخل الكانفس نفسه) ---------- */
  function draw(canvas, cell, quiet) {
    if (!modules) return;
    var n = modules.length, size = (n + quiet * 2) * cell;
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = color();
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (modules[r][c]) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
    }
    if (logoOn() && logoReady) {
      var logoW = Math.round(size * 0.34);
      var logoH = Math.round(logoW / logoRatio);
      var padX = Math.round(logoH * 0.32), padY = Math.round(logoH * 0.32);
      var boxW = logoW + padX * 2, boxH = logoH + padY * 2;
      var bx = Math.round((size - boxW) / 2), by = Math.round((size - boxH) / 2);
      ctx.fillStyle = "#ffffff";
      roundRect(ctx, bx, by, boxW, boxH, Math.round(boxH * 0.28)); ctx.fill();
      ctx.drawImage(logoImg, bx + padX, by + padY, logoW, logoH);
    }
  }

  /* ---------- SVG مع تضمين الشعار ---------- */
  function svgString(cell, quiet) {
    var n = modules.length, size = (n + quiet * 2) * cell, d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (modules[r][c]) d += "M" + ((c + quiet) * cell) + " " + ((r + quiet) * cell) + "h" + cell + "v" + cell + "h" + (-cell) + "z";
    }
    var extra = "";
    if (logoOn() && logoDataUri) {
      var logoW = Math.round(size * 0.34), logoH = Math.round(logoW / logoRatio);
      var padX = Math.round(logoH * 0.32), padY = Math.round(logoH * 0.32);
      var boxW = logoW + padX * 2, boxH = logoH + padY * 2;
      var bx = Math.round((size - boxW) / 2), by = Math.round((size - boxH) / 2), rad = Math.round(boxH * 0.28);
      extra =
        '<rect x="' + bx + '" y="' + by + '" width="' + boxW + '" height="' + boxH + '" rx="' + rad + '" fill="#ffffff"/>' +
        '<image x="' + (bx + padX) + '" y="' + (by + padY) + '" width="' + logoW + '" height="' + logoH + '" href="' + logoDataUri + '"/>';
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<rect width="' + size + '" height="' + size + '" fill="#ffffff"/><path fill="' + color() + '" d="' + d + '"/>' + extra + "</svg>";
  }

  function download(href, name) {
    var a = document.createElement("a"); a.href = href; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- الأحداث ---------- */
  ["qUrl", "qColor", "qLogo"].forEach(function (id) {
    $("#" + id).addEventListener("input", build);
    $("#" + id).addEventListener("change", build);
  });
  $("#qCta").addEventListener("input", function () { $("#pCta").textContent = this.value; });
  $("#qSub").addEventListener("input", function () { $("#pSub").textContent = this.value; });

  $("#btnPng").addEventListener("click", function () {
    if (!modules) return;
    var px = parseInt($("#qSize").value, 10);
    var n = modules.length, quiet = 4;
    var cell = Math.max(1, Math.floor(px / (n + quiet * 2)));
    var tmp = document.createElement("canvas");
    draw(tmp, cell, quiet);
    try { download(tmp.toDataURL("image/png"), "qr-aleqtisadi.png"); }
    catch (e) { alert("تعذّر التصدير. جرّب تحميل SVG."); }
  });

  $("#btnSvg").addEventListener("click", function () {
    if (!modules) return;
    var blob = new Blob([svgString(10, 4)], { type: "image/svg+xml" });
    var url = URL.createObjectURL(blob);
    download(url, "qr-aleqtisadi.svg");
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });

  $("#btnPrint").addEventListener("click", function () { window.print(); });

  /* ---------- تحميل اللوجو الكامل (كـ data URI حتى لا يُفسد تصدير الكانفس) ---------- */
  fetch("assets/img/logo.svg").then(function (r) { return r.text(); }).then(function (txt) {
    // استخراج نسبة العرض/الارتفاع من الـ viewBox لضبط الخلفية البيضاء
    var vb = txt.match(/viewBox\s*=\s*["']\s*[\d.\-]+\s+[\d.\-]+\s+([\d.]+)\s+([\d.]+)/i);
    if (vb) logoRatio = parseFloat(vb[1]) / parseFloat(vb[2]);
    logoDataUri = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(txt)));
    logoImg.onload = function () {
      if (logoImg.naturalWidth && logoImg.naturalHeight) logoRatio = logoImg.naturalWidth / logoImg.naturalHeight;
      logoReady = true; build();
    };
    logoImg.src = logoDataUri;
  }).catch(function () {});

  /* ---------- بيانات المتجر للملصق ---------- */
  fetch("content/site.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (s) {
      var name = (s.name_ar || s.name_en || "");
      var branch = (s.branch_ar || s.branch_en || "");
      $("#pBranch").textContent = (name + " " + branch).trim();
      if (s.logo) $("#pLogo").src = s.logo;
      build();
    })
    .catch(build);

  $("#qUrl").value = defaultUrl();
  $("#pSub").textContent = $("#qSub").value;
  build();
})();
</script>
</body>
</html>
