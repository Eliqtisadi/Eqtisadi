<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>لوحة التحكم — الاقتصادي</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ===== تخصيص لوحة التحكم بهوية «الاقتصادي» =====
       الخط: Cairo — اللون الأساسي: أزرق اللوجو (#1D4ED8 ≈ hsl(224 76% 48%))
       !important لأن ستايل Sveltia يُحمَّل بعد هذا الملف */
    :root{
      /* الخطوط */
      --sui-font-family-default: "Cairo", "Inter", system-ui, "Segoe UI", sans-serif !important;
      --sui-heading-font-family: "Cairo", "Inter", system-ui, "Segoe UI", sans-serif !important;

      /* درجة اللون الأساسية */
      --sui-base-hue: 224 !important;

      /* ألوان التمييز — أزرق الهوية */
      --sui-primary-accent-color: hsl(224 76% 48%) !important;
      --sui-primary-accent-color-text: hsl(224 84% 62%) !important;
      --sui-primary-accent-color-light: hsl(224 76% 53%) !important;
      --sui-primary-accent-color-dark: hsl(224 76% 40%) !important;
      --sui-primary-accent-color-translucent: hsl(224 76% 48% / .22) !important;
      --sui-primary-accent-color-translucent-light: hsl(224 76% 48% / .12) !important;

      /* حلقة التركيز بنفس الأزرق */
      --sui-focus-ring-color: hsl(224 82% 52% / .6) !important;
    }

    /* لمسة دافئة على خلفية الصفحة في الوضع الفاتح لتقترب من مظهر الموقع */
    @media (prefers-color-scheme: light){
      :root{
        --sui-primary-background-color: #F4EFE7 !important;
        --sui-secondary-background-color: #FBF7F0 !important;
      }
    }

    /* الخط على العناصر الأساسية مباشرةً كضمان إضافي */
    body, button, input, select, textarea{
      font-family: "Cairo", "Inter", system-ui, "Segoe UI", sans-serif !important;
    }
  </style>
</head>
<body>
  <!-- فرض اتجاه من اليمين لليسار (Sveltia يضبط الاتجاه حسب لغة المتصفح) -->
  <script>
    (function () {
      var el = document.documentElement;
      function forceRtl() { if (el.getAttribute("dir") !== "rtl") el.setAttribute("dir", "rtl"); }
      forceRtl();
      try {
        new MutationObserver(forceRtl).observe(el, { attributes: true, attributeFilter: ["dir"] });
      } catch (e) {}
    })();
  </script>

  <!-- Sveltia CMS — واجهة حديثة وسريعة، تقرأ نفس config.yml وتستخدم نفس تسجيل الدخول -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
</body>
</html>
